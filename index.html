<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>ห้องเรียนออนไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/app.css">
<style>
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.userbtn{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:.9rem;flex:none}
main{max-width:1180px;margin:0 auto;padding:24px 16px 64px;display:grid;gap:24px}
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.kpis.three{gap:8px}.kpis.three .kpi{padding:12px}.kpis.three .kpi b{font-size:1.3rem}.who{display:none}}
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.course-head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line-2)}
.course-head .bar{width:160px}
.lesson{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line-2)}
.lesson:last-child{border-bottom:0}
.lesson.locked{opacity:.62}
.lnum{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.9rem;
  border:1.5px solid var(--line);color:var(--muted);background:var(--surface)}
.lnum.done{background:var(--ok);border-color:var(--ok);color:#fff}
.lnum.doing{border-color:var(--accent);color:var(--accent)}
.lnum svg{width:16px;height:16px}
.lmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:4px}
.lright{display:flex;align-items:center;gap:14px}
.lpct{width:90px;display:grid;gap:4px;text-align:right}
@media (max-width:640px){.lesson{grid-template-columns:36px 1fr}.lright{grid-column:2;justify-content:space-between}.lpct{text-align:left}}

.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:.88rem}
.crumb a{color:inherit;text-decoration:none}.crumb a:hover{color:var(--accent)}
.player{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:960px){.player{grid-template-columns:1fr}}
.stage{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;max-width:100%}
.stage video,.stage iframe,.stage #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.veil{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;z-index:5;
  background:rgba(8,14,12,.86);color:#fff}
.veil b{display:block;font-size:1.2rem;margin-bottom:6px}
.veil svg{width:34px;height:34px;margin-bottom:8px;opacity:.9}
.cam{position:relative;border-radius:var(--radius-sm);overflow:hidden;background:#0b0f0e;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
.cam .rec{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;padding:2px 8px;border-radius:99px;display:flex;gap:6px;align-items:center}
.cam .rec i{width:7px;height:7px;border-radius:50%;background:#ff5a4f}
dl.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:0;font-size:.92rem}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.rules{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:.88rem;color:var(--ink-2)}
.consent{font-size:.92rem;display:grid;gap:10px;color:var(--ink-2)}
.consent ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spinner"></div></div></div>
<script src="/assets/core.js"></script>
<script type="module" src="/assets/student.js"></script>
</body>
</html>
