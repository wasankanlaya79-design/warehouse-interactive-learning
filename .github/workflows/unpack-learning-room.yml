name: Unpack learning-room source

on:
  push:
    branches:
      - learning-room-source
    paths:
      - ".github/workflows/unpack-learning-room.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: learning-room-source

      - name: Rebuild archive
        run: |
          cat .upload/part*.b64 | base64 -d > /tmp/learning-room-source.zip
          mkdir -p /tmp/learning-room
          unzip -o /tmp/learning-room-source.zip -d /tmp/learning-room

      - name: Replace branch contents with source
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/learning-room/. .
          rm -rf .upload

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Import learning-room source"
            git push origin learning-room-source
          fi
