name: Replace website from uploaded source

on:
  push:
    branches:
      - main
    paths:
      - ".upload/source.zip"
      - ".github/workflows/unpack-learning-room.yml"

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract uploaded source
        run: |
          rm -rf /tmp/learning-room
          mkdir -p /tmp/learning-room
          unzip -o .upload/source.zip -d /tmp/learning-room

      - name: Replace website contents
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/learning-room/. .
          rm -rf .upload

      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Replace website with uploaded learning-room source"
            git push origin main
          fi
